<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f4f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10151f" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex,nofollow">
<title>Vienna Trip Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a transit-line timeline. Each day is a "line" (U1, U2 ... like Wiener Linien signage);
   stops are stations on a vertical line, walks/rides are the track between them. */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --surface-2:#e8ecf2; --fg:#141a24; --muted:#5b6575;
  --rule:#d5dbe4; --accent:#d4001a; --accent-fg:#ffffff; --good:#1f7a3f; --warn:#9a5b00;
  --font-display:"Assistant",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-body:"Assistant",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --line:#d4001a; color-scheme:light;
  --c-museum:#7d68b8; --c-sight:#4f7fd6; --c-market:#3f8f3a; --c-food:#c77a2a; --c-fun:#c94b5a;
  --c-transport:#7468a8; --c-rest:#8a919c; --c-arrive:#4c88b8; --c-israel:#8a2be2; --c-flight:#5b4597; --c-other:#8a919c;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151f; --surface:#182030; --surface-2:#212b3d; --fg:#e9edf4; --muted:#9aa5b8; --rule:#2c374b;
  --accent:#ff4d5e; --accent-fg:#10151f; --good:#5fcf86; --warn:#f0b35a; color-scheme:dark;
  --c-museum:#a996e6; --c-sight:#86a9f0; --c-market:#79c36f; --c-food:#eba45e; --c-fun:#f08490;
  --c-transport:#a69be0; --c-rest:#9aa3b0; --c-arrive:#86b8e0; --c-israel:#b47cf5; --c-flight:#9b87e0; --c-other:#9aa3b0;
}}
:root[data-theme="dark"]{
  --bg:#10151f; --surface:#182030; --surface-2:#212b3d; --fg:#e9edf4; --muted:#9aa5b8; --rule:#2c374b;
  --accent:#ff4d5e; --accent-fg:#10151f; --good:#5fcf86; --warn:#f0b35a; color-scheme:dark;
  --c-museum:#a996e6; --c-sight:#86a9f0; --c-market:#79c36f; --c-food:#eba45e; --c-fun:#f08490;
  --c-transport:#a69be0; --c-rest:#9aa3b0; --c-arrive:#86b8e0; --c-israel:#b47cf5; --c-flight:#9b87e0; --c-other:#9aa3b0;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 var(--font-body);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:20}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);border-bottom:1px solid var(--rule)}
.hbar{display:flex;align-items:center;gap:12px;padding-block:10px 8px}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand h1{margin:0;font:700 1.55rem/1 var(--font-display);letter-spacing:.01em;text-transform:uppercase}
.brand small{color:var(--muted);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{display:flex;align-items:center;gap:8px;flex-shrink:0}
.sync-dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.sync-dot.ok{background:var(--good)} .sync-dot.stale{background:var(--warn)}
.iconbtn{border:1px solid var(--rule);background:var(--surface-2);border-radius:10px;height:40px;min-width:40px;padding:0 10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:.85rem}
.iconbtn svg{width:18px;height:18px}
.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.views{display:flex;gap:6px;padding-block:0 10px}
.views button{flex:1;border:0;background:transparent;border-bottom:3px solid transparent;padding:6px 4px 7px;font:600 1.05rem/1 var(--font-display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);cursor:pointer}
.views button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}

/* day strip */
.days{display:flex;gap:8px;overflow-x:auto;padding-block:12px;scrollbar-width:none;scroll-snap-type:x proximity}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;scroll-snap-align:start;display:flex;align-items:center;gap:8px;border:1px solid var(--rule);background:var(--surface);border-radius:12px;padding:6px 12px 6px 6px;cursor:pointer;text-align:left}
.day[aria-selected="true"]{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg) inset}
.badge{display:inline-grid;place-items:center;min-width:34px;height:34px;border-radius:7px;background:var(--line);color:#fff;font:700 1.05rem/1 var(--font-display);letter-spacing:.02em;padding:0 5px}
.day .dl{display:flex;flex-direction:column;line-height:1.1}
.day .dl b{font:600 1.05rem/1.1 var(--font-display);text-transform:uppercase;letter-spacing:.03em}
.day .dl span{font-size:.78rem;color:var(--muted)}
.day.today .dl span{color:var(--accent);font-weight:700}

/* banners */
.notice{border:1px solid var(--rule);background:var(--surface);border-radius:14px;padding:12px 14px;margin-block:4px 12px;font-size:.92rem}
.notice.warn{border-color:var(--warn)}
.notice b{font-weight:700}
.now{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:baseline;border-radius:14px;padding:12px 14px;margin-block:4px 14px;background:var(--surface);border:2px solid var(--line)}
.now .lbl{font:700 .8rem/1 var(--font-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.now .val{font-weight:700;min-width:0}
.now .val span{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}

/* timeline */
.dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:4px 10px}
.dayhead h2{margin:0;font:700 1.9rem/1 var(--font-display);text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.dayhead p{margin:0;color:var(--muted);font-size:.85rem;text-align:right;white-space:nowrap}
.tl{list-style:none;margin:0;padding:0 0 40px;position:relative}
.tl::before{content:"";position:absolute;left:73px;top:10px;bottom:48px;width:6px;border-radius:3px;background:var(--line)}
.st{position:relative;display:grid;grid-template-columns:60px 1fr;gap:0 26px;padding-block:6px}
.st .t{font:600 1.1rem/1.25 var(--font-display);font-variant-numeric:tabular-nums;text-align:right;padding-top:9px}
.st .t small{display:block;font:500 .82rem/1.2 var(--font-display);color:var(--muted)}
.st .dot{position:absolute;left:66px;top:15px;width:20px;height:20px;border-radius:50%;background:var(--surface);border:5px solid var(--line);z-index:1}
.st.past{opacity:.55}
.st.current .dot{background:var(--line);box-shadow:0 0 0 6px color-mix(in srgb,var(--line) 25%,transparent)}
.card{min-width:0;background:var(--surface);border:1px solid var(--rule);border-radius:14px;overflow:hidden}
.card>button{all:unset;box-sizing:border-box;display:block;width:100%;padding:10px 12px;cursor:pointer}
.card>button:focus-visible{outline:3px solid var(--accent);outline-offset:-3px;border-radius:14px}
.ttl{font-weight:700;font-size:1.02rem;line-height:1.3;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:4px;font-size:.8rem;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;font:600 .78rem/1 var(--font-display);letter-spacing:.07em;text-transform:uppercase;color:var(--cat)}
.chip::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--cat)}
.body{padding:0 12px 12px;display:grid;gap:10px;font-size:.93rem}
.body p{margin:0;overflow-wrap:anywhere}
.body .k{display:block;font:600 .74rem/1.2 var(--font-display);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:2px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:7px;text-decoration:none;border-radius:10px;padding:9px 12px;font-weight:700;font-size:.9rem;background:var(--line);color:#fff;border:0}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn svg{width:17px;height:17px;flex-shrink:0}
/* legs (walks / rides) sit on the line itself */
.leg{position:relative;display:grid;grid-template-columns:60px 1fr;gap:0 26px;padding-block:2px;font-size:.88rem}
.leg .t{font:500 .88rem/1.2 var(--font-display);color:var(--muted);text-align:right;padding-top:9px;font-variant-numeric:tabular-nums}
.leg .lg{display:flex;align-items:center;gap:4px 10px;flex-wrap:wrap;min-width:0;padding:8px 0 8px 16px;color:var(--muted)}
.leg .lg b{color:var(--fg);font-weight:700;overflow-wrap:anywhere}
.leg .ico{position:absolute;left:62px;top:9px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--bg);border:2px solid var(--line);z-index:1}
.leg .ico svg{width:15px;height:15px}
.leg a{color:var(--fg);font-weight:700;white-space:nowrap}
.leg.past{opacity:.55}
.conn{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:8px;font-size:.8rem;color:var(--muted);padding:0 12px 10px}
.conn svg{width:14px;height:14px}
.muted-row .card{background:transparent;border-style:dashed}
.empty{padding:40px 0;color:var(--muted);text-align:center}

/* bookings */
.bk h2{margin:16px 0 8px;font:700 1.9rem/1 var(--font-display);text-transform:uppercase}
.progress{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden;margin-block:6px 16px}
.progress i{display:block;height:100%;background:var(--good);border-radius:5px}
.grp{margin-block:18px 8px;font:700 .85rem/1 var(--font-display);text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.bitem{display:grid;grid-template-columns:28px 1fr;gap:10px;background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:12px;margin-bottom:8px}
.bitem.done{opacity:.6}
.bitem.done .ttl{text-decoration:line-through}
.check{width:24px;height:24px;border-radius:7px;border:2px solid var(--rule);display:grid;place-items:center;margin-top:1px}
.bitem.done .check{background:var(--good);border-color:var(--good);color:var(--surface)}
.check svg{width:16px;height:16px}
.bitem .meta{font-size:.84rem}
.bitem p{margin:6px 0 0;font-size:.9rem}
.bitem a{font-weight:700}
footer{color:var(--muted);font-size:.8rem;padding-block:8px 40px;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  <footer id="foot"></footer>
</main>

/* ---------------------------- loading ---------------------------- */
function apiUrl() {
  const p = new URLSearchParams();
  p.append("ranges", `'${CONFIG.TABS.plan}'!A1:I100`);
  p.append("ranges", `'${CONFIG.TABS.info}'!A1:H400`);
  p.append("ranges", `'${CONFIG.TABS.book}'!A1:G80`);
  p.set("includeGridData", "true");
  p.set("fields", "sheets(properties(title),merges,data(rowData(values(formattedValue,hyperlink,note,userEnteredValue/formulaValue,effectiveValue/boolValue,effectiveFormat/backgroundColor))))");
  p.set("key", CONFIG.API_KEY);
  return `https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.SHEET_ID}?${p}`;
}
function readCache() { try { return JSON.parse(localStorage.getItem(CACHE_KEY) || "null"); } catch { return null; } }
function writeCache(raw) { try { localStorage.setItem(CACHE_KEY, JSON.stringify({ at: Date.now(), raw })); } catch {} }
function readUI() { try { return JSON.parse(localStorage.getItem(UI_KEY) || "{}"); } catch { return {}; } }
function writeUI(v) { try { localStorage.setItem(UI_KEY, JSON.stringify(v)); } catch {} }

let MODEL = null, SOURCE = null, UI = readUI(), loading = false;

async function load(manual) {
  if (loading) return; loading = true;
  $("#refresh").classList.add("spin");
  const hasKey = CONFIG.API_KEY && !CONFIG.API_KEY.startsWith("PASTE_");
  try {
    if (!hasKey) throw Object.assign(new Error("no-key"), { code: "nokey" });
    const res = await fetch(apiUrl(), { cache: "no-store" });
    if (!res.ok) {
      let msg = `HTTP ${res.status}`;
      try { const j = await res.json(); msg = j.error?.message || msg; } catch {}
      throw Object.assign(new Error(msg), { code: res.status });
    }
    const raw = await res.json();
    MODEL = parse(raw);
    writeCache(raw);
    SOURCE = { kind: "live", at: Date.now() };
  } catch (e) {
    const c = readCache();
    if (c) { MODEL = parse(c.raw); SOURCE = { kind: "cache", at: c.at, err: e }; }
    else if (SNAPSHOT) { MODEL = parse(SNAPSHOT); SOURCE = { kind: "snapshot", err: e }; }
    else { SOURCE = { kind: "none", err: e }; }
  } finally {
    loading = false; $("#refresh").classList.remove("spin");
    render();
  }
}

/* ---------------------------- parsing ---------------------------- */
function sheetByTitle(raw, t) { return raw.sheets.find(s => s.properties?.title === t) || null; }
function rows(sheet) { return sheet?.data?.[0]?.rowData?.map(r => r.values || []) || []; }
const txt = c => (c?.formattedValue ?? "").toString().trim();
function linkOf(c) {
  if (!c) return null;
  if (c.hyperlink) return c.hyperlink;
  const f = c.userEnteredValue?.formulaValue;
  const m = f && f.match(/HYPERLINK\(\s*"([^"]+)"/i);
  return m ? m[1] : null;
}
function hex(bg) {
  if (!bg) return "#ffffff";
  const h = v => Math.round((v ?? 0) * 255).toString(16).padStart(2, "0");
  return "#" + h(bg.red) + h(bg.green) + h(bg.blue);
}
function catOf(bg) {
  const c = hex(bg), rgb = s => [1, 3, 5].map(i => parseInt(s.slice(i, i + 2), 16));
  const [r, g, b] = rgb(c); let best = "other", bd = Infinity;
  for (const [k, v] of Object.entries(CATS)) {
    const [R, G, B] = rgb(v), d = (r - R) ** 2 + (g - G) ** 2 + (b - B) ** 2;
    if (d < bd) { bd = d; best = k; }
  }
  return bd < 900 ? best : "other";
}
function parseDate(s) { // "25-Nov", "1-Dec", "25/11/2026", "11/25/2026" ...
  let m = s.match(/(\d{1,2})[-\s./]([A-Za-z]{3})/);
  if (m) return new Date(CONFIG.YEAR, MONTHS[m[2].toLowerCase()], +m[1]);
  m = s.match(/(\d{1,2})[./](\d{1,2})(?:[./](\d{2,4}))?/);
  if (m) { const a = +m[1], b = +m[2]; const [d, mo] = a > 12 ? [a, b] : b > 12 ? [b, a] : [a, b]; return new Date(CONFIG.YEAR, mo - 1, d); }
  return null;
}
const fmt = mins => { const m = ((mins % 1440) + 1440) % 1440; return String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"); };
const dur = m => m < 60 ? `${m} min` : `${Math.floor(m / 60)} h${m % 60 ? " " + (m % 60) : ""}`;
const dkey = d => `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;

function parseNote(note) {
  const out = { travel: null, hint: "", desc: "" };
  if (!note) return out;
  const lines = note.replace(/\r/g, "").split("\n");
  let i = 0;
  if (/^\d{1,2}:\d{2}\s*-\s*\d{1,2}:\d{2}/.test(lines[0] || "")) i = 1;
  const head = [];
  for (; i < lines.length && lines[i].trim() !== ""; i++) head.push(lines[i].trim());
  const rest = lines.slice(i).join("\n").trim();
  const m = head[0] && head[0].match(/^(Walk|Transit) from (.+?):\s*(.+)$/i);
  if (m) { out.travel = { mode: m[1].toLowerCase() === "walk" ? "walk" : "ride", from: m[2], mins: m[3] }; out.hint = head.slice(1).join(" · "); }
  else if (head[0] && /^same site$/i.test(head[0])) { out.travel = { same: true }; out.hint = head.slice(1).join(" · "); }
  else if (head.length) { out.desc = head.join("\n"); }
  out.desc = [out.desc, rest].filter(Boolean).join("\n\n");
  return out;
}

function parse(raw) {
  const plan = sheetByTitle(raw, CONFIG.TABS.plan);
  if (!plan) throw new Error(`Tab "${CONFIG.TABS.plan}" not found`);
  const g = rows(plan);
  const span = {}; // "r,c" -> rows
  for (const m of plan.merges || []) if (m.endColumnIndex - m.startColumnIndex === 1 || m.startRowIndex !== 2)
    span[`${m.startRowIndex},${m.startColumnIndex}`] = m.endRowIndex - m.startRowIndex;
  // find the first time row: first row whose column A looks like "5:00"
  let r0 = g.findIndex(r => /^\d{1,2}:\d{2}$/.test(txt(r[0])));
  if (r0 < 0) r0 = 3;
  const t0 = (() => { const [h, mm] = txt(g[r0][0]).split(":").map(Number); return (h || 5) * 60 + (mm || 0); })();
  const hotelText = txt(g[2]?.[1]);

  // explanations
  const info = {}, infoByName = {};
  for (const r of rows(sheetByTitle(raw, CONFIG.TABS.info)).slice(1)) {
    const cell = txt(r[3]).toUpperCase(), name = txt(r[4]);
    const v = { what: txt(r[5]), practical: txt(r[6]) };
    if (cell) info[cell] = v; if (name) infoByName[name] = v;
  }

  const days = [];
  const ncol = Math.max(...g.slice(0, 2).map(r => r.length));
  for (let c = 1; c < ncol; c++) {
    const date = parseDate(txt(g[0]?.[c]));
    if (!date) continue;
    const items = [];
    for (let r = r0; r < g.length; r++) {
      const cell = g[r]?.[c]; const label = txt(cell);
      if (!label) continue;
      const rowsN = span[`${r},${c}`] || 1;
      const start = t0 + (r - r0) * 15, end = start + rowsN * 15;
      const cat = catOf(cell.effectiveFormat?.backgroundColor);
      const addr = String.fromCharCode(65 + c) + (r + 1);
      const n = parseNote(cell.note);
      items.push({ id: `${c}-${r}`, addr, label, start, end, cat, url: linkOf(cell), ...n,
        info: info[addr] || infoByName[label] || null });
    }
    const visible = items.filter(i => !["sleep", "gray", "white"].includes(i.cat));
    if (!visible.length) continue;
    days.push({ col: c, date, weekday: txt(g[1]?.[c]), items: visible, line: LINES[(days.length) % LINES.length] });
  }

  // bookings
  const bk = rows(sheetByTitle(raw, CONFIG.TABS.book));
  const head = (bk[0] || []).map(txt).map(s => s.toLowerCase());
  const col = (...names) => head.findIndex(h => names.some(n => h.startsWith(n)));
  const ci = { pr: col("priority"), what: col("what"), when: col("when"), where: col("where"), cost: col("approx", "cost"), done: col("done"), notes: col("notes") };
  const bookings = bk.slice(1).map(r => ({
    priority: txt(r[ci.pr]), what: txt(r[ci.what]), when: txt(r[ci.when]),
    where: txt(r[ci.where]), whereUrl: linkOf(r[ci.where]), cost: txt(r[ci.cost]),
    done: !!r[ci.done]?.effectiveValue?.boolValue, hasBox: r[ci.done]?.effectiveValue?.boolValue !== undefined, notes: txt(r[ci.notes]),
  })).filter(b => b.what);

  return { days, hotelText, bookings };
}

/* ---------------------------- time ---------------------------- */
function viennaNow() {
  const parts = Object.fromEntries(new Intl.DateTimeFormat("en-GB", { timeZone: CONFIG.TIMEZONE, year: "numeric", month: "numeric", day: "numeric", hour: "numeric", minute: "numeric", hourCycle: "h23" })
    .formatToParts(new Date()).map(p => [p.type, p.value]));
  return { date: new Date(+parts.year, +parts.month - 1, +parts.day), mins: +parts.hour * 60 + +parts.minute };
}
// a stop belongs to "day d" even after midnight (e.g. 01:00 sleep), so compare in day-minutes
function dayClock(day) {
  const n = viennaNow();
  const diff = Math.round((n.date - day.date) / 864e5);
  return diff * 1440 + n.mins; // minutes since that day's 00:00
}

/* ---------------------------- render ---------------------------- */
function render() {
  renderStatus();
  if (!MODEL) { $("#days").replaceChildren(); $("#dayview").replaceChildren(); $("#nowbox").replaceChildren(); $("#viewBook").replaceChildren(); return; }
  const hotel = MODEL.hotelText.split("\n")[0];
  $("#sub").textContent = (hotel ? hotel + " · " : "") + rangeText();
  renderDays(); renderBook();
  $("#foot").replaceChildren(el("span", {}, "Edits come from the Google Sheet. Tap ", el("b", {}, "↻"), " to reload."));
}
function rangeText() {
  const d = MODEL.days; if (!d.length) return "";
  const f = x => x.toLocaleDateString("en-GB", { day: "numeric", month: "short" });
  return `${f(d[0].date)} – ${f(d[d.length - 1].date)}`;
}
function since(t) {
  const m = Math.round((Date.now() - t) / 60000);
  if (m < 1) return "just now"; if (m < 60) return `${m} min ago`;
  const h = Math.round(m / 60); if (h < 48) return `${h} h ago`;
  return new Date(t).toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
}
function renderStatus() {
  const s = SOURCE || {}, box = $("#status"), dot = $("#syncDot");
  dot.className = "sync-dot" + (s.kind === "live" ? " ok" : s.kind ? " stale" : "");
  dot.title = s.kind === "live" ? "Up to date with the sheet" : "Not live";
  const err = s.err, why = !err ? "" : err.code === "nokey" ? "No API key set in the page yet."
    : err.code === 403 ? "Google refused the request – check the sheet is shared as “Anyone with the link” and the API key allows this site."
    : err.code === 400 || err.code === 404 ? `Couldn't read the sheet (${err.message}). Check the sheet ID and tab names.`
    : navigator.onLine === false ? "You're offline." : `Couldn't reach Google (${err.message}).`;
  if (s.kind === "live" || !s.kind) { box.replaceChildren(); return; }
  const msg = s.kind === "cache" ? [el("b", {}, "Showing the copy saved on this phone "), `(${since(s.at)}). `, why]
    : s.kind === "snapshot" ? [el("b", {}, "Showing the built-in copy of the plan. "), why]
    : [el("b", {}, "No plan to show yet. "), why];
  box.replaceChildren(el("div", { class: "notice warn", role: "status" }, ...msg));
}

function pickDefaultDay() {
  const today = viennaNow().date;
  const i = MODEL.days.findIndex(d => dkey(d.date) === dkey(today));
  if (i >= 0) return MODEL.days[i].col;
  if (UI.day && MODEL.days.some(d => d.col === UI.day)) return UI.day;
  return MODEL.days[0]?.col;
}
let current = null;
function renderDays() {
  if (current == null || !MODEL.days.some(d => d.col === current)) current = pickDefaultDay();
  const today = dkey(viennaNow().date);
  $("#days").replaceChildren(...MODEL.days.map(d => {
    const isToday = dkey(d.date) === today;
    const b = el("button", { class: "day" + (isToday ? " today" : ""), type: "button", "aria-selected": String(d.col === current),
      onclick: () => { current = d.col; UI.day = d.col; writeUI(UI); renderDays(); window.scrollTo({ top: 0 }); } },
      el("span", { class: "badge", style: `background:${d.line.c}` }, d.line.b),
      el("span", { class: "dl" }, el("b", {}, d.date.toLocaleDateString("en-GB", { weekday: "short" }) + " " + d.date.getDate()),
        el("span", {}, isToday ? "Today" : d.date.toLocaleDateString("en-GB", { month: "short" }))));
    return b;
  }));
  const sel = $("#days").querySelector('[aria-selected="true"]'); sel?.scrollIntoView({ inline: "nearest", block: "nearest" });
  renderDay(MODEL.days.find(d => d.col === current));
}

function travelLine(it) {
  if (!it.travel || it.travel.same) return null;
  return el("div", { class: "conn" }, svg(it.travel.mode === "walk" ? ICON.walk : ICON.ride),
    el("span", {}, `${it.travel.mode === "walk" ? "Walk" : "Ride"} from ${it.travel.from} · ${it.travel.mins}`));
}
function routeBtn(it, label) {
  if (!it.url) return null;
  return el("a", { class: "btn", href: it.url, target: "_blank", rel: "noopener" }, svg(ICON.route), label || "Directions");
}
function findBtn(it) {
  const q = encodeURIComponent(it.label.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B50}\u{FE0F}]/gu, "").replace(/\(.*?\)/g, "").trim() + " Wien");
  return el("a", { class: "btn ghost", href: `https://www.google.com/maps/search/?api=1&query=${q}`, target: "_blank", rel: "noopener" }, svg(ICON.pin), "On the map");
}

function renderDay(day) {
  const box = $("#dayview"), nowbox = $("#nowbox");
  if (!day) { box.replaceChildren(el("p", { class: "empty" }, "No days found in the sheet.")); nowbox.replaceChildren(); return; }
  document.documentElement.style.setProperty("--line", day.line.c);
  const clock = dayClock(day);
  const live = clock >= 0 && clock < 1440 + 6 * 60;
  const nowIt = live ? day.items.find(i => i.start <= clock && clock < i.end) : null;
  const nextIt = live ? day.items.find(i => i.start > clock) : null;

  // countdown / now
  const first = MODEL.days[0].date, todayD = viennaNow().date;
  const daysTo = Math.round((first - todayD) / 864e5);
  if (live && (nowIt || nextIt)) {
    nowbox.replaceChildren(el("div", { class: "now", role: "status" },
      nowIt ? el("span", { class: "lbl" }, "Now") : null, nowIt ? el("span", { class: "val", dir: "auto" }, nowIt.label, " ", el("span", {}, "until " + fmt(nowIt.end))) : null,
      nextIt ? el("span", { class: "lbl" }, "Next") : null, nextIt ? el("span", { class: "val", dir: "auto" }, nextIt.label, " ", el("span", {}, fmt(nextIt.start) + (nextIt.start - clock < 120 ? ` · in ${nextIt.start - clock} min` : ""))) : null));
  } else if (daysTo > 0) {
    nowbox.replaceChildren(el("div", { class: "notice" }, el("b", {}, `${daysTo} day${daysTo === 1 ? "" : "s"} to go. `), "On trip days this page opens on today and shows what's on now and next."));
  } else nowbox.replaceChildren();

  const head = el("div", { class: "dayhead" },
    el("h2", {}, day.date.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" })),
    el("p", {}, `${day.items.filter(i => i.cat !== "transport").length} stops`));

  const list = el("ol", { class: "tl" });
  for (const it of day.items) {
    const past = live && clock >= it.end, cur = nowIt && nowIt.id === it.id;
    const catVar = `var(--c-${it.cat in CAT_LABEL ? it.cat : "other"})`;
    if (it.cat === "transport") {
      list.append(el("li", { class: "leg" + (past ? " past" : "") },
        el("div", { class: "t" }, fmt(it.start)),
        el("span", { class: "ico", "aria-hidden": "true" }, svg(/walk/i.test(it.label) || it.travel?.mode === "walk" ? ICON.walk : ICON.ride)),
        el("div", { class: "lg" }, el("b", { dir: "auto" }, it.label),
          el("span", {}, it.travel?.mins ? it.travel.mins : `${it.end - it.start} min`),
          it.url ? el("a", { href: it.url, target: "_blank", rel: "noopener" }, "Directions ›") : null,
          it.hint ? el("span", { style: "flex-basis:100%" }, it.hint) : null,
          it.desc ? el("span", { style: "flex-basis:100%" }, it.desc) : null)));
      continue;
    }
    const open = UI.open?.[it.id] ?? cur;
    const bodyKids = [
      it.desc ? el("p", { dir: "auto" }, it.desc) : null,
      it.info?.what ? el("p", {}, el("span", { class: "k" }, "What it is"), it.info.what) : null,
      it.info?.practical ? el("p", {}, el("span", { class: "k" }, "Practical"), it.info.practical) : null,
      it.hint ? el("p", {}, el("span", { class: "k" }, "Getting there"), it.hint) : null,
      el("div", { class: "actions" }, routeBtn(it, it.travel?.from ? `Route from ${it.travel.from}` : "Directions"),
        ["israel", "flight"].includes(it.cat) ? null : findBtn(it)),
    ].filter(Boolean);
    const bodyId = "b-" + it.id;
    const card = el("div", { class: "card" },
      el("button", { type: "button", "aria-expanded": String(!!open), "aria-controls": bodyId, onclick: e => {
          UI.open = UI.open || {}; const now = !(UI.open[it.id] ?? cur); UI.open[it.id] = now; writeUI(UI);
          e.currentTarget.setAttribute("aria-expanded", String(now)); document.getElementById(bodyId).hidden = !now; } },
        el("div", { class: "ttl", dir: "auto" }, it.label),
        el("div", { class: "meta" }, el("span", { class: "chip", style: `--cat:${catVar}` }, CAT_LABEL[it.cat] || "Plan"),
          el("span", {}, dur(it.end - it.start)))),
      travelLine(it),
      el("div", { class: "body", id: bodyId, hidden: !open }, ...bodyKids));
    list.append(el("li", { class: "st" + (past ? " past" : "") + (cur ? " current" : "") + (["israel", "flight"].includes(it.cat) ? " muted-row" : "") },
      el("div", { class: "t" }, fmt(it.start), el("small", {}, fmt(it.end))),
      el("span", { class: "dot", "aria-hidden": "true" }), card));
  }
  box.replaceChildren(head, list);
}

function renderBook() {
  const b = MODEL.bookings, sec = $("#viewBook");
  const boxes = b.filter(x => x.hasBox), done = boxes.filter(x => x.done).length;
  const groups = [];
  for (const x of b) { let g = groups.find(g => g.name === x.priority); if (!g) groups.push(g = { name: x.priority, items: [] }); g.items.push(x); }
  sec.replaceChildren(
    el("h2", {}, "To book"),
    el("div", { class: "meta" }, `${done} of ${boxes.length} done · tick the boxes in the sheet`),
    el("div", { class: "progress", role: "progressbar", "aria-valuemin": "0", "aria-valuemax": String(boxes.length), "aria-valuenow": String(done) },
      el("i", { style: `width:${boxes.length ? (100 * done / boxes.length) : 0}%` })),
    ...groups.flatMap(g => [el("div", { class: "grp" }, g.name || "Other"), ...g.items.map(x =>
      el("div", { class: "bitem" + (x.done ? " done" : "") },
        x.hasBox ? el("span", { class: "check", "aria-label": x.done ? "Done" : "Not done yet" }, x.done ? svg(ICON.check) : null) : el("span"),
        el("div", { style: "min-width:0" },
          el("div", { class: "ttl" }, x.what),
          el("div", { class: "meta" }, x.when ? el("span", {}, x.when) : null, x.cost ? el("span", {}, x.cost) : null,
            x.whereUrl ? el("a", { href: x.whereUrl, target: "_blank", rel: "noopener" }, x.where + " ›") : x.where ? el("span", {}, x.where) : null),
          x.notes ? el("p", {}, x.notes) : null)))]));
}

function setView(v) {
  const days = v !== "book";
  $("#tabDays").setAttribute("aria-selected", String(days)); $("#tabBook").setAttribute("aria-selected", String(!days));
  $("#viewDays").hidden = !days; $("#viewBook").hidden = days;
  UI.view = v; writeUI(UI);
}
$("#tabDays").onclick = () => setView("days");
$("#tabBook").onclick = () => setView("book");
$("#refresh").onclick = () => load(true);
document.addEventListener("visibilitychange", () => { if (!document.hidden && SOURCE && Date.now() - (SOURCE.at || 0) > 5 * 60e3) load(); });
setInterval(() => { if (MODEL && !document.hidden) renderDay(MODEL.days.find(d => d.col === current)); }, 60e3);

setView(UI.view || "days");
// show the saved copy instantly, then fetch fresh data
(() => { const c = readCache(); if (c) { try { MODEL = parse(c.raw); SOURCE = { kind: "cache", at: c.at }; render(); } catch {} } })();
load();
</script>
</body>
</html>
